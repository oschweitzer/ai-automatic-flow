<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #626a73;
    --border: #e3e0d8; --accent: #2f6fdf; --accent-soft: #e8f0fd; --code-bg: #f3f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa3ad;
      --border: #30353c; --accent: #6ea2ff; --accent-soft: #1f2b40; --code-bg: #262a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 96px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.35rem; margin: 48px 0 12px; padding-top: 16px; border-top: 1px solid var(--border); }
  h3 { font-size: 1.1rem; margin: 28px 0 8px; }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
  code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font-size: .88em; }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: .95rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  blockquote { margin: 16px 0; padding: 4px 16px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  img { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; }
  video { max-width: 100%; border-radius: 8px; }
  details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  .mermaid { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; overflow-x: auto; }

  /* Listen bar */
  .player {
    position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .player button {
    font: inherit; font-size: .95rem; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  .player button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .player select, .player input { font: inherit; font-size: .9rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; max-width: 220px; }
  .player label { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .player audio { width: 100%; }
  .player .hint { font-size: .8rem; color: var(--muted); width: 100%; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="player" id="player">
    <audio id="audio" class="hidden" controls preload="none"></audio>
    <button class="primary" id="play">🔊 Écouter</button>
    <button id="stop">⏹</button>
    <label>Voix <select id="voice"></select></label>
    <label>Vitesse <input id="rate" type="range" min="0.7" max="1.5" step="0.05" value="1"></label>
    <span class="hint" id="hint"></span>
  </div>
  <article id="content"></article>
</main>

<script type="text/markdown" id="md">{{MARKDOWN}}</script>
<script type="text/plain" id="narration">{{NARRATION}}</script>
<script>window.REPORT = { lang: "{{LANG}}", audio: "{{AUDIO}}" };</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function () {
  const lang = (window.REPORT.lang || "fr").slice(0, 2);
  const L = lang === "fr"
    ? { play: "🔊 Écouter", pause: "⏸ Pause", resume: "▶ Reprendre", noVoice: "Aucune voix française trouvée dans ce navigateur : la lecture utilisera la voix par défaut.", file: "Version audio générée hors ligne." }
    : { play: "🔊 Listen", pause: "⏸ Pause", resume: "▶ Resume", noVoice: "No English voice found in this browser: the default voice will be used.", file: "Offline-generated audio version." };

  // ---- Render markdown + mermaid ----
  const md = document.getElementById("md").textContent;
  const article = document.getElementById("content");
  article.innerHTML = marked.parse(md);
  article.querySelectorAll("pre > code.language-mermaid").forEach(code => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
  mermaid.run({ querySelector: ".mermaid" });
  const h1 = article.querySelector("h1");
  if (h1) document.title = h1.textContent;

  // ---- Audio ----
  const narration = document.getElementById("narration").textContent.trim();
  const playBtn = document.getElementById("play"), stopBtn = document.getElementById("stop");
  const voiceSel = document.getElementById("voice"), rate = document.getElementById("rate");
  const hint = document.getElementById("hint"), audio = document.getElementById("audio");
  playBtn.textContent = L.play;

  // Pre-generated audio file (say / piper) takes priority: better and consistent quality.
  if (window.REPORT.audio) {
    audio.src = window.REPORT.audio;
    audio.classList.remove("hidden");
    [playBtn, stopBtn, voiceSel.parentElement].forEach(el => el.classList.add("hidden"));
    rate.addEventListener("input", () => { audio.playbackRate = parseFloat(rate.value); });
    hint.textContent = L.file;
    return;
  }

  if (!narration || !("speechSynthesis" in window)) {
    document.getElementById("player").classList.add("hidden");
    return;
  }

  const synth = window.speechSynthesis;
  // Chrome stops long utterances after ~15s: speak sentence by sentence.
  const chunks = narration.split(/(?<=[.!?…:])\s+|\n{2,}/).map(s => s.trim()).filter(Boolean);
  let idx = 0, state = "idle", voices = [];

  function score(v) {
    let s = 0;
    if (/premium|enhanced|améliorée|natural|neural|online/i.test(v.name)) s += 10;
    if (/google|microsoft/i.test(v.name)) s += 5;
    if (/^fr-FR|^en-US/i.test(v.lang)) s += 2;
    if (/grandma|grandpa|bad news|good news|bells|boing|bubbles|cellos|wobble|jester|bahh|whisper|zarvox|trinoids|organ|superstar/i.test(v.name)) s -= 50;
    return s;
  }
  function loadVoices() {
    voices = synth.getVoices().filter(v => v.lang.toLowerCase().startsWith(lang)).sort((a, b) => score(b) - score(a));
    let saved = null;
    try { saved = localStorage.getItem("explain-feature-voice-" + lang); } catch (e) {}
    voiceSel.innerHTML = "";
    voices.forEach((v, i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = v.name.replace(/\s*\(.*\)$/, "") + " (" + v.lang + ")";
      if (v.name === saved) o.selected = true;
      voiceSel.appendChild(o);
    });
    hint.textContent = voices.length ? "" : L.noVoice;
  }
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  voiceSel.addEventListener("change", () => {
    try { localStorage.setItem("explain-feature-voice-" + lang, voices[voiceSel.value].name); } catch (e) {}
    if (state === "playing") { synth.cancel(); speakNext(); }
  });

  function speakNext() {
    if (idx >= chunks.length) { reset(); return; }
    const u = new SpeechSynthesisUtterance(chunks[idx]);
    const v = voices[voiceSel.value];
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = lang === "fr" ? "fr-FR" : "en-US"; }
    u.rate = parseFloat(rate.value);
    u.onend = () => { if (state === "playing") { idx++; speakNext(); } };
    synth.speak(u);
  }
  function reset() { synth.cancel(); idx = 0; state = "idle"; playBtn.textContent = L.play; }

  playBtn.addEventListener("click", () => {
    if (state === "idle") { state = "playing"; playBtn.textContent = L.pause; synth.cancel(); speakNext(); }
    else if (state === "playing") { state = "paused"; synth.pause(); playBtn.textContent = L.resume; }
    else { state = "playing"; synth.resume(); playBtn.textContent = L.pause; }
  });
  stopBtn.addEventListener("click", reset);
  window.addEventListener("beforeunload", () => synth.cancel());
})();
</script>
</body>
</html>
